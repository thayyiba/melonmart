<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist · Melon Mart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="melon-pages.css"></head><body data-active="wishlist"><div id="siteHeader"></div><main class="page-shell"><section class="page-hero"><span class="eyebrow">your saved little finds</span><h1>Wishlist ♡</h1><p>Things you liked enough to save. Keep them here until the timing feels right.</p></section><section class="paper-card" style="padding:24px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px"><div><h2 class="section-title">Saved things</h2><p class="section-subtitle" style="margin-bottom:0">Your wishlist is connected to your Melon Mart account.</p></div><button id="clearBtn" class="danger-btn">Clear wishlist</button></div><div id="wishlistGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px"></div></section></main><footer class="site-footer">Made with questionable amounts of CSS ✦ · Melon Mart</footer><div id="toast" class="toast"></div><script src="melon-pages.js"></script><script>
const grid=document.getElementById('wishlistGrid'),clearBtn=document.getElementById('clearBtn');
function esc(v){return mmEsc(v)}
async function load(){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">Loading your saved things…</div>';try{const r=await fetch(MM_BASE+'/api/wishlist');if(r.status===401){location.href='login.html';return}if(!r.ok)throw new Error();const items=await r.json();render(items)}catch(e){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">We could not load your wishlist right now.</div>'}}
function render(items){if(!items?.length){clearBtn.style.display='none';grid.innerHTML='<div class="empty-state" style="grid-column:1/-1;padding:70px 20px"><div class="big-icon">♡</div><h2>Nothing saved yet</h2><p>When something makes you smile, tap the heart and it will live here.</p><a class="primary-btn" href="index.html">Browse Melon Mart</a></div>';return}clearBtn.style.display='block';grid.innerHTML=items.map(p=>`<article class="paper-card" style="overflow:hidden"><div style="aspect-ratio:1/1;background:var(--butter-light);position:relative"><img src="${esc(p.imageUrl||'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=700&q=80')}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover"><button onclick="removeItem(${p.id})" title="Remove" style="position:absolute;right:10px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:var(--paper);color:var(--plum);font-size:18px">♥</button></div><div style="padding:16px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">${esc(p.category||'Good find')}</div><h3 style="font-family:Fraunces,serif;color:var(--plum-dark);font-size:20px;margin:5px 0">${esc(p.name)}</h3><strong style="color:var(--plum);font-size:16px">₹${Number(p.price||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</strong><button class="primary-btn" style="width:100%;margin-top:13px" onclick="addCart(${p.id})">Add to cart</button></div></article>`).join('')}
async function removeItem(id){const b=new URLSearchParams({action:'remove',productId:id});const r=await fetch(MM_BASE+'/api/wishlist',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});if(r.ok)load()}
async function addCart(id){const r=await fetch(MM_BASE+'/api/cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:Number(id),quantity:1})});if(r.ok)showToast('Added to your bag ✦');else if(r.status===401)location.href='login.html';else showToast('Could not add that item')}
clearBtn.onclick=async()=>{if(!confirm('Clear your wishlist?'))return;const items=await fetch(MM_BASE+'/api/wishlist').then(r=>r.json());for(const p of items){await removeItem(p.id)}load()};function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}load();</script></body></html>
