<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melon Mart - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: #f8f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #efe8f8;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #581c87;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .welcome {
            text-align: center;
            color: #7e22ce;
            opacity: 0.8;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 800;
            font-size: 12px;
            color: #581c87;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #e9d5ff;
            border-radius: 10px;
            background: #faf5ff;
            font-size: 14px;
            color: #2e1065;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background: #ffffff;
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #7e22ce;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #6b21a8;
        }

        button:disabled {
            background: #c084fc;
            cursor: not-allowed;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
            margin-bottom: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #6b21a8;
            font-size: 13.5px;
        }

        .register-link a {
            color: #7e22ce;
            font-weight: 800;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🍉</div>

        <h1>Welcome Back</h1>

        <p class="welcome">Login to Melon Mart ♡</p>

        <div id="errorMessage" class="error-msg">
            Invalid email or password. Please try again!
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" id="submitBtn">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

    <script>

        // Automatically detects the MelonMart application context path.
        // Example: /melonmart
        const API_BASE = window.location.pathname.substring(
            0,
            window.location.pathname.lastIndexOf("/")
        );

        async function handleLogin(event) {

            event.preventDefault();

            const emailInput =
                document.getElementById("email").value.trim();

            const passwordInput =
                document.getElementById("password").value;

            const errorDiv =
                document.getElementById("errorMessage");

            const submitBtn =
                document.getElementById("submitBtn");

            // Hide previous error
            errorDiv.style.display = "none";

            // Disable button while request is running
            submitBtn.disabled = true;
            submitBtn.innerText = "Logging in...";

            try {

                const response = await fetch(
                    API_BASE + "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: emailInput,
                            password: passwordInput
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

                    // Login successful
                    window.location.href = "index.html";

                } else {

                    errorDiv.innerText =
                        data.error ||
                        data.message ||
                        "Invalid email or password. Please try again!";

                    errorDiv.style.display = "block";
                }

            } catch (err) {

                console.error("Login error:", err);

                errorDiv.innerText =
                    "Server error. Please check backend connection!";

                errorDiv.style.display = "block";

            } finally {

                submitBtn.disabled = false;
                submitBtn.innerText = "Login";

            }
        }

    </script>

</body>

</html>
