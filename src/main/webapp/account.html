<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account · Melon Mart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="melon-pages.css"></head><body><div id="siteHeader"></div><main class="page-shell"><section class="page-hero"><span class="eyebrow">your little corner of the market</span><h1>My Account</h1><p>Everything you need, without a giant popup getting in the way.</p></section><div id="accountPage"></div></main><script src="melon-pages.js"></script><script>
async function loadAccount(){const u=await mmUser();if(!u){location.href='login.html';return}const name=u.name||u.username||'Melon Mart User',role=String(u.role||'BUYER').toUpperCase();const roleCard=role==='SELLER'?'<a class="paper-card" style="padding:22px" href="seller.html"><h3 class="section-title" style="font-size:22px">Seller Dashboard 🏪</h3><p class="section-subtitle" style="margin:0">Manage listings, incoming orders and sales.</p></a>':role==='ADMIN'?'<a class="paper-card" style="padding:22px" href="admin.html"><h3 class="section-title" style="font-size:22px">Admin Dashboard 🛡️</h3><p class="section-subtitle" style="margin:0">Users, orders and marketplace listings.</p></a>':'';document.getElementById('accountPage').innerHTML=`<div class="paper-card" style="padding:28px;margin-bottom:22px"><div style="display:flex;align-items:center;gap:16px"><div class="account-avatar" style="width:64px;height:64px;font-size:27px">${mmEsc(name.charAt(0).toUpperCase())}</div><div><h2 class="section-title" style="margin:0">${mmEsc(name)}</h2><p class="section-subtitle" style="margin:3px 0 0">${mmEsc(u.email||'')} · ${mmEsc(role)}</p></div></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px"><a class="paper-card" style="padding:22px" href="orders.html"><h3 class="section-title" style="font-size:22px">My Orders 📦</h3><p class="section-subtitle" style="margin:0">Track purchases and order status.</p></a><a class="paper-card" style="padding:22px" href="wishlist.html"><h3 class="section-title" style="font-size:22px">Wishlist ♡</h3><p class="section-subtitle" style="margin:0">Your saved little finds.</p></a><a class="paper-card" style="padding:22px" href="location.html"><h3 class="section-title" style="font-size:22px">Delivery Addresses 📍</h3><p class="section-subtitle" style="margin:0">Manage where we deliver.</p></a><a class="paper-card" style="padding:22px" href="reviews.html"><h3 class="section-title" style="font-size:22px">My Reviews ★</h3><p class="section-subtitle" style="margin:0">See and manage your reviews.</p></a><a class="paper-card" style="padding:22px" href="cart.html"><h3 class="section-title" style="font-size:22px">My Cart 🛒</h3><p class="section-subtitle" style="margin:0">Review your basket and checkout.</p></a>${roleCard}<a class="paper-card" style="padding:22px" href="help.html"><h3 class="section-title" style="font-size:22px">Help & Support ✦</h3><p class="section-subtitle" style="margin:0">Answers for the little confusing bits.</p></a></div>`}loadAccount();</script></body></html>
