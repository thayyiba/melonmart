<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Cart · Melon Mart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="melon-pages.css"></head><body><div id="siteHeader"></div><main class="page-shell"><section class="page-hero"><span class="eyebrow">your basket</span><h1>My Cart 🛒</h1><p>Everything you picked, in one pleasantly uncluttered place.</p></section><div id="cartPage"></div></main><script src="melon-pages.js"></script><script>
async function loadCart(){const root=document.getElementById('cartPage');try{const r=await fetch(MM_BASE+'/api/cart');if(r.status===401){location.href='login.html';return}if(!r.ok)throw new Error();const items=await r.json();renderCart(items)}catch(e){root.innerHTML='<div class="paper-card empty-state"><div class="big-icon">🛒</div><h2>We could not load your bag</h2><p>Try again in a moment.</p></div>'}}
function renderCart(items){if(!items?.length){document.getElementById('cartPage').innerHTML='<div class="paper-card empty-state"><div class="big-icon">🛒</div><h2>Your cart is empty</h2><p>A little browse might fix that.</p><a class="primary-btn" href="index.html">Continue shopping</a></div>';return}let total=0;const rows=items.map(i=>{const q=Number(i.quantity||1),p=Number(i.price||0);total+=q*p;return `<div style="display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)"><img src="${mmEsc(i.imageUrl||'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=500&q=80')}" style="width:90px;height:90px;object-fit:cover;border-radius:16px;background:var(--butter-light)"><div><div style="font-family:Fraunces,serif;font-size:21px;color:var(--plum-dark)">${mmEsc(i.name||'Product')}</div><div style="color:var(--muted);font-size:12px">₹${p.toFixed(2)} each</div><div style="display:flex;align-items:center;gap:8px;margin-top:10px"><button class="secondary-btn" onclick="changeQ(${i.productId},${q-1})">−</button><strong>${q}</strong><button class="secondary-btn" onclick="changeQ(${i.productId},${q+1})">+</button><button class="danger-btn" onclick="removeQ(${i.productId})">remove</button></div></div><strong style="color:var(--plum)">₹${(p*q).toFixed(2)}</strong></div>`}).join('');document.getElementById('cartPage').innerHTML=`<div class="paper-card" style="padding:24px"><div>${rows}</div><div style="display:flex;justify-content:flex-end;align-items:center;gap:20px;padding-top:22px"><div style="text-align:right"><small style="color:var(--muted)">running total</small><div style="font-family:Fraunces,serif;font-size:30px;color:var(--plum-dark)">₹${total.toFixed(2)}</div></div><a class="primary-btn" href="checkout.html">Continue to checkout →</a></div></div>`}
async function changeQ(id,q){if(q<=0)return removeQ(id);await fetch(MM_BASE+'/api/cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:Number(id),quantity:Number(q)})});loadCart()}async function removeQ(id){await fetch(MM_BASE+'/api/cart?productId='+encodeURIComponent(id),{method:'DELETE'});loadCart()}loadCart();</script></body></html>
